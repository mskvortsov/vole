CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2

CONFIG_ESP32_WIFI_IRAM_OPT=y
CONFIG_ESP32_WIFI_RX_IRAM_OPT=y

CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# workaround for a bootloop on esp32c6
CONFIG_ESP_HAL_LOG_LEVEL_OFF=y
# CONFIG_ESP_HAL_EARLY_LOG_LEVEL=0

CONFIG_CRYPTO=y
CONFIG_CRYPTO_ESP32_SHA_SESSIONS_MAX=6

CONFIG_DTLS_PKT_COUNT=8
CONFIG_WIREGUARD_BUF_COUNT=8
CONFIG_CODEL_TARGET_MS=4
CONFIG_CODEL_INTERVAL_MS=40
